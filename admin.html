<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Quản trị cửa hàng cây giống</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --forest:#16301f; --leaf:#3f7d4e; --mint:#e4efe1; --cream:#f7f2e7; --paper:#fffdf8;
    --ink:#1b2a20; --muted:#5d6b60; --line:#e3dccb; --fruit:#e9792f; --fruit-2:#d35f1a; --red:#d64234; --sun:#f2b632;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none!important}
  body{font-family:"Be Vietnam Pro",system-ui,-apple-system,sans-serif;background:var(--cream);color:var(--ink);line-height:1.5;font-size:15px}
  a{color:var(--leaf)}
  button{font:inherit;cursor:pointer}
  :focus-visible{outline:3px solid var(--sun);outline-offset:2px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:12px 18px;font-weight:700}
  .btn-primary{background:linear-gradient(135deg,var(--fruit),var(--fruit-2));color:#fff}
  .btn-primary:disabled{opacity:.5;cursor:not-allowed}
  .btn-ghost{background:#fff;border:1.5px solid var(--line);color:var(--forest)}
  .btn-sm{padding:7px 12px;font-size:13.5px;border-radius:10px}

  /* Đăng nhập */
  .login{max-width:460px;margin:40px auto;padding:0 16px}
  .card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px}
  .login h1{font-size:22px;color:var(--forest);margin-bottom:4px}
  .login p.sub{color:var(--muted);margin-bottom:18px}
  .login ol{margin:14px 0 0 20px;color:var(--muted);font-size:13.5px;display:grid;gap:4px}
  .err-box{background:#fdecea;color:var(--red);border-radius:10px;padding:10px 12px;margin-top:12px;font-size:14px}

  /* Thanh trên */
  .bar{position:sticky;top:0;z-index:10;background:var(--forest);color:#fff}
  .bar-in{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .bar h1{font-size:16px;margin-right:auto}
  .bar a{color:#cfe3cf;font-size:14px}
  .status{font-size:13px;color:#cfe3cf;width:100%;order:3}
  .status.warn{color:var(--sun)}

  .layout{max-width:1100px;margin:0 auto;padding:16px;display:grid;gap:16px}
  .toc{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
  .toc a{flex:none;background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:13.5px;font-weight:600;color:var(--forest);text-decoration:none}
  @media (min-width:900px){
    .layout{grid-template-columns:220px 1fr;align-items:start}
    .toc{flex-direction:column;position:sticky;top:76px}
    .toc a{border-radius:10px}
    .status{width:auto;order:0}
  }

  section.sec{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;scroll-margin-top:80px}
  .sections{display:grid;gap:16px;min-width:0}
  .sec h2{font-size:18px;color:var(--forest)}
  .sec .hint{color:var(--muted);font-size:13.5px;margin-top:2px}
  .fields{display:grid;gap:14px;margin-top:16px}
  .f label.lbl{display:block;font-weight:600;font-size:14px;color:var(--forest);margin-bottom:5px}
  .f input[type=text],.f input[type=number],.f textarea{width:100%;font:inherit;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink)}
  .f textarea{min-height:76px;resize:vertical}
  .f input:focus,.f textarea:focus{outline:0;border-color:var(--leaf);box-shadow:0 0 0 3px rgba(63,125,78,.15)}
  .money-hint{font-size:12.5px;color:var(--muted);margin-top:3px}
  .check{display:flex;align-items:center;gap:10px;font-weight:600;color:var(--forest);cursor:pointer}
  .check input{width:20px;height:20px;accent-color:var(--leaf)}
  .media{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .media img,.media video{width:120px;height:120px;object-fit:cover;border-radius:12px;background:var(--mint);border:1px solid var(--line)}
  .media .info{font-size:12.5px;color:var(--muted);word-break:break-all;flex:1;min-width:140px}
  .media .new{color:var(--fruit-2);font-weight:700}

  .list{margin-top:18px}
  .list > h3{font-size:15px;color:var(--forest);margin-bottom:8px}
  .item{border:1.5px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;background:var(--paper)}
  .item-head{display:flex;align-items:center;gap:6px;margin-bottom:10px}
  .item-head b{margin-right:auto;font-size:14px;color:var(--forest)}
  .icon-btn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--forest);font-weight:800}
  .icon-btn.del{color:var(--red)}
  .icon-btn:disabled{opacity:.35}
  .item .fields{margin-top:0;gap:10px}
  @media (min-width:640px){ .item .fields{grid-template-columns:1fr 1fr} .item .f.wide{grid-column:1/-1} }

  .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--forest);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:20;max-width:calc(100% - 32px)}
  .toast.bad{background:var(--red)}

  /* Mục sản phẩm thu gọn được, danh sách lồng nhau */
  details.item{padding:0}
  details.item > summary{list-style:none;cursor:pointer;padding:12px 14px}
  details.item > summary::-webkit-details-marker{display:none}
  details.item > summary .item-head{margin:0}
  details.item > summary .item-head b::before{content:"▸ ";color:var(--leaf)}
  details.item[open] > summary .item-head b::before{content:"▾ "}
  details.item > .fields{padding:0 14px 14px}
  .thumb{width:40px;height:40px;border-radius:8px;object-fit:cover;flex:none;background:var(--mint)}
  .f select{width:100%;font:inherit;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink)}
  .sub-list{grid-column:1/-1;background:#fff;border:1px dashed var(--line);border-radius:12px;padding:12px}
  .sub-list > h3{font-size:14px}
  .sub-list .item{background:var(--cream)}
</style>
</head>
<body>

<!-- ĐĂNG NHẬP -->
<div class="login" id="loginView">
  <div class="card">
    <h1>Quản trị cửa hàng</h1>
    <p class="sub">Đăng nhập để chọn cây bán theo mùa, sửa giá, nội dung và hình ảnh.</p>
    <p class="sub" style="background:var(--mint);border-radius:10px;padding:10px 12px;color:var(--forest)">Bản demo: tài khoản <b>admin</b>, mật khẩu <b>demo123</b>. Thay đổi chỉ lưu trên máy này để xem trước, chưa đưa lên trang thật.</p>
    <form id="loginForm" class="fields">
      <div class="f"><label class="lbl" for="l-user">Tài khoản</label><input type="text" id="l-user" autocomplete="username" autocapitalize="none" spellcheck="false"></div>
      <div class="f"><label class="lbl" for="l-pass">Mật khẩu</label><input type="password" id="l-pass" autocomplete="current-password"></div>
      <label class="check"><input type="checkbox" id="l-remember" checked>Ghi nhớ đăng nhập trên máy này</label>
      <button class="btn btn-primary" type="submit" id="loginBtn">Đăng nhập</button>
    </form>
    <div class="err-box" id="loginErr" hidden></div>
  </div>
</div>

<!-- TRÌNH SỬA -->
<div id="editorView" hidden>
  <div class="bar"><div class="bar-in">
    <h1>Quản trị cửa hàng</h1>
    <a href="./?preview=1" target="_blank" rel="noopener">Xem trước ↗</a>
    <button class="btn btn-ghost btn-sm" id="reloadBtn" type="button">Khôi phục mặc định</button>
    <button class="btn btn-ghost btn-sm" id="logoutBtn" type="button">Đăng xuất</button>
    <button class="btn btn-primary btn-sm" id="saveBtn" type="button" disabled>Lưu thay đổi</button>
    <div class="status" id="status">Chưa có thay đổi</div>
  </div></div>
  <div class="layout">
    <nav class="toc" id="toc"></nav>
    <div class="sections" id="sections"></div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="config.js?v=7"></script>
<script>
// Các mục sửa được. Field: [đường dẫn, nhãn, kiểu, rộng cả dòng | định nghĩa danh sách con]
// Kiểu: text (mặc định), textarea, money, number, bool, image, video, color, select (danh sách lựa chọn), product (chọn cây trong thư viện), list
const SPEC_LIST = { title: 'Thông số', label: it => it.label || 'Thông số mới', newItem: { label: '', value: '' },
  fields: [['label', 'Tên (vd: Ra trái sau)'], ['value', 'Giá trị (vd: 9–12 tháng)']] };
const FACT_LIST = { title: 'Ô thông số đầu trang (nên để 3 ô)', label: it => it.big || 'Ô mới', newItem: { big: '', small: '' },
  fields: [['big', 'Chữ lớn (vd: 9–12 tháng)'], ['small', 'Chữ nhỏ (vd: là ra trái)']] };
const BUNDLE_LIST = { title: 'Gói ưu đãi (ngoài mua lẻ)', label: it => it.name || 'Gói mới', newItem: { name: '', price: 0, note: '', freeship: false, hot: false },
  fields: [['name', 'Tên gói (vd: Gói 6 cây)'], ['price', 'Giá cả gói', 'money'], ['note', 'Ghi chú (vd: Miễn ship · 25.000đ/cây)'], ['freeship', 'Gói này miễn phí ship', 'bool'], ['hot', 'Đánh dấu "Bán chạy nhất" (được chọn sẵn)', 'bool']] };
const ART_OPTS = [['3d', 'Mô hình 3D cây cau (xoay được)'], ['cau', 'Hình vẽ cây cau'], ['tree', 'Hình vẽ cây ăn quả (tán tròn)'], ['image', 'Dùng ảnh tải lên']];
const SECTIONS = [
  { id: 'mua', title: 'Cây bán mùa này', hint: 'Mỗi mùa trang chỉ bán một cây. Chọn cây ở đây, cả trang (tiêu đề, hình vẽ, giá, gói, ảnh, video) đổi theo cây đó.',
    fields: [['season.current', 'Cây đang bán', 'product']] },
  { id: 'sp', title: 'Thư viện cây', hint: 'Soạn sẵn thông tin từng cây. Đến mùa nào thì chọn cây đó ở mục "Cây bán mùa này". Bấm vào tên cây để mở ra sửa.',
    lists: [{ key: 'products', title: 'Các cây', collapsible: true, thumb: 'photo1', label: it => it.name || 'Cây mới',
      newItem: { name: '', seasonLabel: '', titleLine1: '', titleLine2: '', sub: '', art: 'tree', artColor: '#e9862f', artImage: '', note1: '', note2: '', price: 0, original: 0, unit: 'cây', minQty: 1,
        photo1: '', photo2: '', photo3: '', desc: '', facts: [], specs: [], bundles: [], videoSrc: '', videoPoster: '' },
      fields: [['name', 'Tên cây (vd: Cau Thái trái dài)'], ['seasonLabel', 'Nhãn mùa (vd: Mùa cau 2026)'],
        ['titleLine1', 'Tiêu đề lớn – dòng 1 (nên 1–2 chữ)'], ['titleLine2', 'Tiêu đề lớn – dòng 2 (nên 1–2 chữ)'], ['sub', 'Mô tả ngắn đầu trang', 'textarea'],
        ['art', 'Hình đầu trang', 'select', ART_OPTS], ['artColor', 'Màu quả chín (hình vẽ và mô hình 3D)', 'color'], ['artImage', 'Ảnh đầu trang (dùng khi chọn "Dùng ảnh tải lên", và làm ảnh dự phòng khi máy khách không chạy được 3D; nên là ảnh nền trong suốt)', 'image'],
        ['note1', 'Ghi chú viết tay 1 (cạnh hình)'], ['note2', 'Ghi chú viết tay 2 (cạnh hình)'],
        ['price', 'Giá bán lẻ', 'money'], ['original', 'Giá gốc (gạch ngang, để 0 nếu không có)', 'money'], ['unit', 'Đơn vị (vd: cây, bầu)'], ['minQty', 'Mua lẻ tối thiểu', 'number'],
        ['photo1', 'Ảnh thực tế 1 (ảnh lớn)', 'image'], ['photo2', 'Ảnh thực tế 2', 'image'], ['photo3', 'Ảnh thực tế 3', 'image'], ['desc', 'Mô tả chi tiết', 'textarea'],
        ['facts', '', 'list', FACT_LIST], ['specs', '', 'list', SPEC_LIST], ['bundles', '', 'list', BUNDLE_LIST],
        ['videoSrc', 'Video của cây (.mp4, để trống thì ẩn phần video)', 'video'], ['videoPoster', 'Ảnh bìa video', 'image']] }] },
  { id: 'ship', title: 'Phí ship',
    fields: [['shipping.fee', 'Phí ship mỗi đơn', 'money'], ['shipping.freeFrom', 'Miễn ship cho đơn từ', 'money'], ['shipping.note', 'Ghi chú phí ship', 'textarea']] },
  { id: 'ch', title: 'Thông tin cửa hàng',
    fields: [['site.name', 'Tên cửa hàng'], ['site.tagline', 'Khẩu hiệu ngắn'], ['site.hotline', 'Hotline'], ['site.zalo', 'Số Zalo'], ['site.address', 'Địa chỉ'], ['site.email', 'Email'], ['site.about', 'Giới thiệu ngắn (chân trang)', 'textarea']] },
  { id: 'km', title: 'Khuyến mãi',
    fields: [['promo.topText', 'Dòng chữ nhỏ đầu trang'], ['promo.countdownLabel', 'Chữ cạnh đồng hồ đếm ngược'], ['promo.countdownDays', 'Số ngày đếm ngược (tính từ lần đầu khách mở trang)', 'number']] },
  { id: 'video', title: 'Phần video',
    fields: [['video.enabled', 'Hiện phần video (khi cây mùa này có video)', 'bool'], ['video.title', 'Tiêu đề'], ['video.lead', 'Mô tả', 'textarea']],
    lists: [{ key: 'video.checks', title: 'Các dòng có dấu tích', label: it => it.text || 'Dòng mới', newItem: { text: '' }, fields: [['text', 'Nội dung', 'text', true]] }] },
  { id: 'so', title: 'Số liệu',
    lists: [{ key: 'stats', title: 'Các ô số liệu (nên để 4 ô)', label: it => it.big || 'Ô mới', newItem: { big: '', small: '' }, fields: [['big', 'Số lớn (vd: 99%)'], ['small', 'Chữ nhỏ']] }] },
  { id: 'loi', title: 'Cam kết',
    fields: [['benefits.title', 'Tiêu đề']],
    lists: [{ key: 'benefits.items', title: 'Các cam kết', label: it => it.title || 'Cam kết mới', newItem: { title: '', desc: '' }, fields: [['title', 'Tiêu đề'], ['desc', 'Mô tả']] }] },
  { id: 'dg', title: 'Đánh giá khách hàng', hint: 'Xoá hết đánh giá thì phần này tự ẩn.',
    lists: [{ key: 'reviews', title: 'Đánh giá', label: it => it.name || 'Đánh giá mới', newItem: { text: '', name: '', place: '' }, fields: [['text', 'Nội dung', 'textarea', true], ['name', 'Tên khách'], ['place', 'Nơi ở']] }] },
  { id: 'faq', title: 'Hỏi đáp',
    lists: [{ key: 'faq', title: 'Câu hỏi', label: it => it.q || 'Câu hỏi mới', newItem: { q: '', a: '' }, fields: [['q', 'Câu hỏi', 'text', true], ['a', 'Trả lời', 'textarea', true]] }] }
];

// BẢN DEMO: chưa lưu lên trang thật. Bản nháp nằm trong localStorage của máy này;
// trang bán hàng mở với ?preview=1 sẽ hiện bản nháp đó.
const DEMO_USER = 'admin', DEMO_PASS = 'demo123';
const LS_AUTH = 'admin_demo_login', LS_DRAFT = 'cfg_preview';
let cfg = null, dirty = false;
let defs = {};                 // đường dẫn danh sách -> định nghĩa, dựng lại mỗi lần vẽ
const openItems = new Set();   // mục sản phẩm đang mở

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = n => (+n || 0).toLocaleString('vi-VN') + 'đ';
const getP = (o, p) => p.split('.').reduce((a, k) => a?.[k], o);
const setP = (o, p, v) => { const ks = p.split('.'); const last = ks.pop(); ks.reduce((a, k) => a[k] ??= {}, o)[last] = v; };

function toast(msg, bad) {
  const t = $('toast'); t.textContent = msg; t.className = 'toast' + (bad ? ' bad' : ''); t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 4000);
}
function setDirty(v = true) {
  dirty = v;
  $('saveBtn').disabled = !v;
  $('status').textContent = v ? 'Có thay đổi chưa lưu' : $('status').dataset.saved || 'Chưa có thay đổi';
  $('status').classList.toggle('warn', v);
}

function loadConfig() {
  let draft = null;
  try { draft = JSON.parse(localStorage.getItem(LS_DRAFT)); } catch (e) {}
  // Bản nháp kiểu cũ (chưa có mục cây theo mùa): bỏ qua
  if (draft && !(Array.isArray(draft.products) && draft.season)) draft = null;
  cfg = draft || structuredClone(window.SITE_CONFIG);
  if (draft) $('status').dataset.saved = 'Đang sửa bản nháp đã lưu trên máy này';
  render();
  setDirty(false);
}

function save() {
  const problem = validate();
  if (problem) { toast(problem, true); return; }
  try {
    localStorage.setItem(LS_DRAFT, JSON.stringify(cfg));
  } catch (e) {
    toast('Bộ nhớ trình duyệt đã đầy (ảnh quá nhiều/quá lớn). Bớt ảnh rồi lưu lại.', true); return;
  }
  const time = new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });
  $('status').dataset.saved = `Đã lưu bản nháp lúc ${time} (bản demo, chưa lên trang thật). Bấm "Xem trước" để xem.`;
  setDirty(false);
  toast('Đã lưu bản nháp. Bấm "Xem trước" để xem trang với nội dung mới.');
}

function validate() {
  if (!cfg.products.length) return 'Thư viện cần ít nhất 1 cây.';
  const names = new Set();
  for (const [i, p] of cfg.products.entries()) {
    const n = p.name.trim();
    if (!n) return `Cây thứ ${i + 1} trong thư viện chưa có tên.`;
    if (names.has(n)) return `Có 2 cây cùng tên "${n}". Mỗi cây cần tên khác nhau.`;
    names.add(n);
    if (!(p.price > 0)) return `"${n}" cần giá bán lẻ lớn hơn 0.`;
    if ((p.bundles || []).some(b => !b.name.trim() || !(b.price > 0))) return `"${n}": mỗi gói ưu đãi cần tên và giá lớn hơn 0.`;
  }
  if (!names.has(cfg.season.current)) return 'Chưa chọn cây bán mùa này (mục "Cây bán mùa này").';
  return '';
}

// ---- Vẽ form ----
function fieldHTML(path, label, type = 'text', extra = false) {
  if (type === 'list') return listHTML(path, extra, true);
  const v = getP(cfg, path), id = 'f_' + path.replace(/\W/g, '_');
  const cls = 'f' + (extra === true || type === 'textarea' || type === 'image' || type === 'video' ? ' wide' : '');
  if (type === 'bool') return `<div class="${cls}"><label class="check"><input type="checkbox" id="${id}" data-p="${path}" data-type="bool"${v ? ' checked' : ''}>${esc(label)}</label></div>`;
  if (type === 'textarea') return `<div class="${cls}"><label class="lbl" for="${id}">${esc(label)}</label><textarea id="${id}" data-p="${path}">${esc(v)}</textarea></div>`;
  if (type === 'money' || type === 'number') return `<div class="${cls}"><label class="lbl" for="${id}">${esc(label)}</label><input type="number" inputmode="numeric" min="0" step="${type === 'money' ? 1000 : 1}" id="${id}" data-p="${path}" data-type="number" value="${esc(v)}">${type === 'money' ? `<div class="money-hint" data-money="${path}">${fmt(v)}</div>` : ''}</div>`;
  if (type === 'select' || type === 'product') {
    const opts = type === 'product' ? cfg.products.map(p => [p.name, p.name]).filter(o => o[0]) : extra;
    if (type === 'product' && v && !opts.some(o => o[0] === v)) opts.unshift([v, v + ' (không còn trong thư viện)']);
    return `<div class="${cls}"><label class="lbl" for="${id}">${esc(label)}</label><select id="${id}" data-p="${path}">${opts.map(([val, lab]) => `<option value="${esc(val)}"${val === v ? ' selected' : ''}>${esc(lab)}</option>`).join('')}</select></div>`;
  }
  if (type === 'color') return `<div class="${cls}"><label class="lbl" for="${id}">${esc(label)}</label><input type="color" id="${id}" data-p="${path}" value="${esc(v || '#e9862f')}" style="width:64px;height:44px;border:0;background:none;padding:0"></div>`;
  if (type === 'image' || type === 'video') {
    const isNew = String(v).startsWith('data:');
    const preview = !v ? '<span class="thumb" style="width:120px;height:120px;border-radius:12px"></span>' : type === 'image' ? `<img src="${esc(v)}" alt="">` : `<video src="${esc(v)}" muted playsinline preload="metadata"></video>`;
    return `<div class="${cls}"><span class="lbl" style="display:block;font-weight:600;font-size:14px;color:var(--forest);margin-bottom:5px">${esc(label)}</span>
      <div class="media">${preview}<div class="info">${isNew ? '<span class="new">Ảnh mới chọn</span>' : v ? esc(v) : 'Chưa có'}<br><br>
      <label class="btn btn-ghost btn-sm">Chọn ${type === 'image' ? 'ảnh' : 'video'}<input type="file" hidden accept="${type === 'image' ? 'image/*' : 'video/mp4'}" data-p="${path}" data-type="${type}"></label>
      ${v && type === 'image' ? ` <button class="btn btn-ghost btn-sm" type="button" data-clear="${path}">Bỏ ảnh</button>` : ''}</div></div></div>`;
  }
  return `<div class="${cls}"><label class="lbl" for="${id}">${esc(label)}</label><input type="text" id="${id}" data-p="${path}" value="${esc(v)}"></div>`;
}

function listHTML(key, def, nested) {
  defs[key] = def;
  const arr = getP(cfg, key) || [];
  if (!getP(cfg, key)) setP(cfg, key, arr);
  const head = (it, i) => `<div class="item-head">${def.thumb ? (it[def.thumb] ? `<img class="thumb" src="${esc(it[def.thumb])}" alt="">` : '<span class="thumb"></span>') : ''}<b>${i + 1}. ${esc(def.label(it))}</b>
      <button class="icon-btn" type="button" data-move="${key}" data-i="${i}" data-d="-1" aria-label="Lên"${i ? '' : ' disabled'}>↑</button>
      <button class="icon-btn" type="button" data-move="${key}" data-i="${i}" data-d="1" aria-label="Xuống"${i < arr.length - 1 ? '' : ' disabled'}>↓</button>
      <button class="icon-btn del" type="button" data-del="${key}" data-i="${i}" aria-label="Xoá">✕</button></div>`;
  const body = (it, i) => `<div class="fields">${def.fields.map(([k, lab, t, w]) => fieldHTML(`${key}.${i}.${k}`, lab, t, w)).join('')}</div>`;
  return `<div class="list${nested ? ' sub-list' : ''}"><h3>${esc(def.title)}</h3>
    ${arr.map((it, i) => def.collapsible
      ? `<details class="item" data-k="${key}.${i}"${openItems.has(`${key}.${i}`) ? ' open' : ''}><summary>${head(it, i)}</summary>${body(it, i)}</details>`
      : `<div class="item">${head(it, i)}${body(it, i)}</div>`).join('')}
    <button class="btn btn-ghost btn-sm" type="button" data-add="${key}">+ Thêm</button></div>`;
}

function render() {
  defs = {};
  const y = scrollY;
  $('toc').innerHTML = SECTIONS.map(s => `<a href="#sec-${s.id}">${esc(s.title)}</a>`).join('');
  $('sections').innerHTML = SECTIONS.map(s => `
    <section class="sec" id="sec-${s.id}">
      <h2>${esc(s.title)}</h2>${s.hint ? `<p class="hint">${esc(s.hint)}</p>` : ''}
      ${s.fields ? `<div class="fields">${s.fields.map(f => fieldHTML(...f)).join('')}</div>` : ''}
      ${(s.lists || []).map(l => listHTML(l.key, l)).join('')}
    </section>`).join('');
  scrollTo(0, y);
}

$('sections').addEventListener('toggle', e => {
  const d = e.target; if (!d.matches?.('details.item')) return;
  d.open ? openItems.add(d.dataset.k) : openItems.delete(d.dataset.k);
}, true);
$('sections').addEventListener('input', e => {
  const el = e.target, p = el.dataset.p;
  if (!p || el.type === 'file') return;
  const v = el.dataset.type === 'bool' ? el.checked : el.dataset.type === 'number' ? (el.value === '' ? 0 : +el.value) : el.value;
  // Đổi tên cây đang bán mùa này thì cập nhật luôn lựa chọn mùa
  if (/^products\.\d+\.name$/.test(p) && getP(cfg, p) === cfg.season.current) cfg.season.current = v;
  setP(cfg, p, v);
  const hint = document.querySelector(`[data-money="${p}"]`);
  if (hint) hint.textContent = fmt(v);
  setDirty();
});
$('sections').addEventListener('change', async e => {
  const el = e.target;
  if (el.type !== 'file' || !el.files[0]) return;
  if (el.dataset.type === 'video') { toast('Bản demo chưa hỗ trợ tải video lên. Khi làm bản chính sẽ có.', true); el.value = ''; return; }
  try {
    // Thu nhỏ ảnh để bản nháp vừa bộ nhớ trình duyệt
    const blob = await resizeImage(el.files[0], 1000, 0.75);
    const dataUrl = await new Promise((ok, fail) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = fail; r.readAsDataURL(blob); });
    setP(cfg, el.dataset.p, dataUrl);
    render(); setDirty();
  } catch (err) {
    toast('Không đọc được ảnh này. Thử ảnh JPG hoặc PNG.', true);
  }
});
$('sections').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.closest('summary')) e.preventDefault();   // nút trong tiêu đề mục không đóng/mở mục
  if (b.dataset.add) {
    const arr = getP(cfg, b.dataset.add); arr.push(structuredClone(defs[b.dataset.add].newItem));
    if (defs[b.dataset.add].collapsible) openItems.add(`${b.dataset.add}.${arr.length - 1}`);
  }
  else if (b.dataset.del) { const arr = getP(cfg, b.dataset.del); if (!confirmDelete(b, defs[b.dataset.del].label(arr[+b.dataset.i]))) return; arr.splice(+b.dataset.i, 1); openItems.clear(); }
  else if (b.dataset.move) { const arr = getP(cfg, b.dataset.move), i = +b.dataset.i, j = i + +b.dataset.d; [arr[i], arr[j]] = [arr[j], arr[i]]; openItems.clear(); }
  else if (b.dataset.clear) setP(cfg, b.dataset.clear, '');
  else return;
  render(); setDirty();
});
// Bấm ✕ lần đầu để hỏi, bấm lần hai trong 3 giây để xoá
function confirmDelete(btn, name) {
  if (btn.dataset.armed) return true;
  btn.dataset.armed = '1'; btn.textContent = 'Xoá?'; btn.style.width = 'auto'; btn.style.padding = '0 10px';
  toast(`Bấm "Xoá?" lần nữa để xoá "${name}"`);
  setTimeout(() => { if (btn.isConnected) { delete btn.dataset.armed; btn.textContent = '✕'; btn.style.cssText = ''; } }, 3000);
  return false;
}

async function resizeImage(file, max, q) {
  const bmp = await createImageBitmap(file);
  const s = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas');
  c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise(ok => c.toBlob(ok, 'image/jpeg', q));
}

// ---- Đăng nhập (demo) ----
function start() {
  loadConfig();
  $('loginView').hidden = true; $('editorView').hidden = false;
}
$('loginForm').addEventListener('submit', e => {
  e.preventDefault();
  const ok = $('l-user').value.trim().toLowerCase() === DEMO_USER && $('l-pass').value === DEMO_PASS;
  $('loginErr').textContent = 'Sai tài khoản hoặc mật khẩu.';
  $('loginErr').hidden = ok;
  if (!ok) return;
  try { $('l-remember').checked ? localStorage.setItem(LS_AUTH, '1') : localStorage.removeItem(LS_AUTH); } catch (e) {}
  start();
});
$('logoutBtn').addEventListener('click', () => {
  if (dirty && !window.confirm('Có thay đổi chưa lưu. Vẫn đăng xuất?')) return;
  try { localStorage.removeItem(LS_AUTH); } catch (e) {}
  location.reload();
});
$('reloadBtn').addEventListener('click', () => {
  if (!window.confirm('Xoá bản nháp và quay về nội dung gốc của trang?')) return;
  try { localStorage.removeItem(LS_DRAFT); } catch (e) {}
  delete $('status').dataset.saved;
  openItems.clear();
  loadConfig();
  toast('Đã quay về nội dung gốc.');
});
$('saveBtn').addEventListener('click', save);
window.addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

try { if (localStorage.getItem(LS_AUTH)) start(); } catch (e) {}
</script>
